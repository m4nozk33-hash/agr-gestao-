nav{width:210px;background:var(--cd);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:16px;margin:0 0 14px;color:var(--ac)}nav h1 small{display:block;color:var(--mu);font-weight:400;font-size:11px}
nav a{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}nav a:hover,nav a.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
nav .s{font-size:11px;text-transform:uppercase;color:var(--mu);margin:14px 10px 4px}
main{flex:1;padding:20px;min-width:0;max-width:1300px}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid var(--bd)}nav h1,nav .s{display:none}nav a{white-space:nowrap}main{padding:12px}}
h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px;font-size:15px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px}
.k small{color:var(--mu);font-size:12px}.k b{display:block;font-size:20px;margin:2px 0}.k i{font-style:normal;font-size:11px;color:var(--mu)}
.up{color:var(--ok)!important}.dn{color:var(--bad)!important}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.fl button{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.fl button.on{background:var(--ac);color:#fff}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}.fl input{width:auto}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu)}tr.c{cursor:pointer}tr.c:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tc{cursor:pointer}.tc:hover{border-color:var(--ac)}.tc .kk{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--bd)}.tc .kk:last-child{border:0}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:10px;align-items:center;padding:6px 0;position:relative}.tl li:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);flex:none}.tl li.d:before{background:var(--ok);border-color:var(--ok)}.tl span{flex:1}.tl input{width:150px}
.hi{padding:8px 0;border-bottom:1px solid var(--bd)}.hi small{color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(440px,92vw)}dialog label{display:block;margin:8px 0;font-size:12px;color:var(--mu)}dialog .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.lg span{margin-right:12px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.ig div small{display:block;color:var(--mu);font-size:11px}

function login(){$('#nv').style.display='none';$('#mn').style.padding='0';$('#mn').style.maxWidth='none';$('#mn').innerHTML=`<div class="lg2"><div class="cv"></div><div class="lb"><div class="fl" style="margin-bottom:14px"><button id="tabLogin" class="on" onclick="showLoginTab()">Entrar</button><button id="tabCreate" onclick="showCreateTab()">Criar conta</button></div><div id="loginPane"><form onsubmit="doLogin(event);return false"><label>E-mail<input id="le" type="email" autocomplete="username" required></label><label>Senha<input id="lp" type="password" autocomplete="current-password" required></label><div id="lerr" class="dn" style="min-height:18px;font-size:13px"></div><button style="width:100%;margin:6px 0 12px">Entrar</button></form><a onclick="forgot()">Esqueci a senha</a></div><div id="createPane" style="display:none"><h3 style="margin-top:0">Criar conta de administrador</h3><p style="color:var(--mu)">Liberação inicial da AGR: serão aceitas somente as 2 primeiras contas de administrador. Depois disso, a criação pública será bloqueada automaticamente.</p><form onsubmit="bootstrapAdmin(event);return false"><label>Nome<input id="bn" required></label><label>E-mail<input id="be" type="email" autocomplete="email" required></label><label>Senha<input id="bp" type="password" minlength="12" autocomplete="new-password" required></label><div id="berr" style="min-height:18px;font-size:13px"></div><button style="width:100%;margin:6px 0 12px">Criar conta ADM</button></form><button class="g" style="width:100%" onclick="showLoginTab()">Voltar para entrar</button></div></div></div>`}
function showLoginTab(){const a=$('#loginPane'),b=$('#createPane');if(a)a.style.display='';if(b)b.style.display='none';$('#tabLogin')?.classList.add('on');$('#tabCreate')?.classList.remove('on')}
function showCreateTab(){const a=$('#loginPane'),b=$('#createPane');if(a)a.style.display='none';if(b)b.style.display='';$('#tabCreate')?.classList.add('on');$('#tabLogin')?.classList.remove('on')}
async function bootstrapAdmin(e){
 e.preventDefault();
 const btn=e.target.querySelector('button');btn.disabled=true;
 const err=$('#berr');if(err)err.textContent='';
 try{
  const r=await api('bootstrap-admin',{nome:$('#bn').value.trim(),email:$('#be').value.toLowerCase().trim(),password:$('#bp').value});
  alert(r.remaining>0?'Conta ADM criada. Crie agora o segundo administrador.':'Conta ADM criada. A criação pública de administradores foi bloqueada automaticamente.');
  showLoginTab();if($('#le'))$('#le').value=$('#be')?.value||'';
 }catch(x){if(err)err.textContent=x.message;else alert(x.message)}
 finally{btn.disabled=false}
}
async function doLogin(e){e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;
 try{await api('login',{email:$('#le').value.toLowerCase().trim(),password:$('#lp').value});const x=await api('session');ME=x.user;await loadShared();V={v:'dash'};render();statusSync('Conectado ao banco compartilhado')}
 catch(x){ME=null;$('#lerr').textContent=x.message;button.disabled=false}}
async function logout(){await queue;try{await api('logout',{})}finally{ME=null;S={colabs:[],clients:[],users:[]};committed=structuredClone(S);render();statusSync('Sessão encerrada')}}
function forgot(){
 const email=($('#le')?.value||'').toLowerCase().trim();
 modal('Recuperar senha',[{k:'email',l:'Seu e-mail cadastrado',t:'email'}],{email},async o=>{
  try{
   o.email=o.email.toLowerCase().trim();
   await api('recover-code',{email:o.email});
   recoveryCode(o.email);
  }catch(e){alert(e.message)}
 },'Enviar código')
}
function recoveryCode(email){
 modal('Digite o código',[{k:'token',l:'Código de 6 dígitos',t:'text'}],{},async o=>{
  try{
   await api('verify-recovery-code',{email,token:String(o.token||'').trim()});
   recoveryNewPassword();
  }catch(e){alert(e.message)}
 },'Validar código')
}
function recoveryNewPassword(){
 modal('Criar nova senha',[
  {k:'password',l:'Nova senha (mín. 12 caracteres)',t:'password'},
  {k:'confirm',l:'Confirmar nova senha',t:'password'}
 ],{},async o=>{
  try{
   if(o.password!==o.confirm){alert('As senhas não coincidem.');return}
   if(typeof o.password!=='string'||o.password.length<12){alert('Use pelo menos 12 caracteres.');return}
   await api('password',{password:o.password});
   alert('Senha alterada com sucesso. Agora você pode entrar com a nova senha.');
   await api('logout',{}).catch(()=>{});
   ME=null;render();
  }catch(e){alert(e.message)}
 },'Alterar senha')
}
function chPw(){modal('Alterar senha',[{k:'password',l:'Nova senha (mín. 12 caracteres)',t:'password'}],{},async o=>{try{await api('password',o);alert('Senha atualizada.')}catch(e){alert(e.message)}})}
function usr(){return`<div class="top"><h2 style="margin:0">Usuários e acessos</h2><button onclick="addU()">+ Usuário</button></div><div class="cd tw"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${u.role=='admin'?'Administrador':'Colaborador ('+esc(co(u.colabId).nome)+')'}</td><td>${u.id!=ME.id?`<a onclick="delU('${u.id}')">remover acesso</a>`:''}</td></tr>`).join('')}</table></div><p>As contas usam autenticação do Supabase. Para recuperar a senha, use “Esqueci a senha” na tela de entrada.</p>`}
function newusr(){if(ME.role!=='admin')return'';return`<div class="top"><h2 style="margin:0">Criar conta</h2><button class="g" onclick="go('usr')">Ver usuários</button></div>
<div class="g2">
 <div class="cd"><h3>👑 Criar Administrador</h3><p style="color:var(--mu)">Cria um novo administrador com área própria, colaboradores e clientes separados.</p><button onclick="addAdmin()">Criar administrador</button></div>
 <div class="cd"><h3>👤 Criar Colaborador</h3><p style="color:var(--mu)">Cria um acesso vinculado a um colaborador da sua equipe.</p><button onclick="addCollaborator()">Criar colaborador</button></div>
</div>`}
function addAdmin(){if(ME.role!=='admin')return;modal('Criar administrador',[{k:'nome',l:'Nome'},{k:'email',l:'E-mail',t:'email'},{k:'password',l:'Senha inicial (mín. 12 caracteres)',t:'password'}],{},async o=>{await queue;try{await api('users',{...o,role:'admin',colabId:null});await loadShared();alert('Administrador criado com sucesso.');go('usr')}catch(e){alert(e.message)}})}
function addCollaborator(){if(ME.role!=='admin')return;if(!S.colabs.length){alert('Cadastre primeiro o colaborador na aba Equipe.');return}modal('Criar colaborador',[{k:'nome',l:'Nome'},{k:'email',l:'E-mail',t:'email'},{k:'password',l:'Senha inicial (mín. 12 caracteres)',t:'password'},{k:'colabId',l:'Colaborador vinculado',t:'select',o:S.colabs.map(c=>[c.id,c.nome])}],{},async o=>{await queue;try{o.colabId=+o.colabId;await api('users',{...o,role:'user'});await loadShared();alert('Colaborador criado com sucesso.');go('usr')}catch(e){alert(e.message)}})}
function addU(){if(ME.role!=='admin')return;modal('Novo usuário',[{k:'nome',l:'Nome'},{k:'email',l:'E-mail',t:'email'},{k:'password',l:'Senha inicial (mín. 12 caracteres)',t:'password'},{k:'role',l:'Perfil',t:'select',o:[['user','Colaborador'],['admin','Administrador']]},{k:'colabId',l:'Colaborador vinculado',t:'select',o:S.colabs.map(c=>[c.id,c.nome])}],{},async o=>{await queue;try{o.colabId=+o.colabId;await api('users',o);await loadShared();render()}catch(e){alert(e.message)}})}
function editCom(id){const c=co(id);modal('Comissão de '+esc(c.nome),[{k:'com',l:'Percentual (%)',t:'number'}],c,o=>{c.com=Math.max(0,Math.min(100,+o.com||0));done()})}
async function delU(id){if(ME.role!=='admin'||!confirm('Remover acesso deste usuário?'))return;try{await api('users',{id},'DELETE');await loadShared();render()}catch(e){alert(e.message)}}
async function boot(){
 try{
  const hash=new URLSearchParams(location.hash.slice(1));
  if(hash.get('type')==='recovery'&&hash.get('access_token')){
   await api('recovery-session',{access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});history.replaceState(null,'',location.pathname);const x=await api('session');ME=x.user;await loadShared();render();chPw();return;
  }
  const x=await api('session');ME=x.user;await loadShared();render();statusSync('Conectado ao banco compartilhado');
 }catch(e){ME=null;render();if(e.status!==401){$('#lerr').textContent=e.message;statusSync('Banco ainda não conectado',true)}}
}
setInterval(async()=>{if(!ME||pending||document.querySelector('dialog[open]'))return;try{const x=await api('state');if(x.version!==VERSION){S=x.state;VERSION=x.version;committed=structuredClone(S);render();statusSync('Dados atualizados pela equipe')}}catch(e){statusSync('Sem conexão: '+e.message,true)}},15000);
render();boot();
